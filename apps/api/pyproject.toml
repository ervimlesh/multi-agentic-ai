[project]
name = "multi-agentic-ai-api"
version = "0.1.0"
description = "Multi-Agent AI Platform — API service"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py310"
